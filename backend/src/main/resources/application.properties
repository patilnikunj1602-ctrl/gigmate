# ==========================================================
# 🐬 Database Configuration (Environment variable with local fallback)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gigmate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nikunj@002}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# ⚡ Hikari Connection Pool Optimizations
# ==========================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ==========================================================
# 📊 JPA & Hibernate Automatic Mapping Schemas
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ==========================================================
# 🔐 JWT Security Authentication Config
# ==========================================================
gigmate.jwt.secret=${GIGMATE_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
gigmate.jwt.expiration=${GIGMATE_JWT_EXPIRATION:86400000}
