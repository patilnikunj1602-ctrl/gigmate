services:
  # ==========================================================
  # ☕ 1. GigMate Spring Boot REST API Backend (Docker Web Service)
  # ==========================================================
  - type: web
    name: gigmate-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false # Set in Render Dashboard: jdbc:mysql://<host>:<port>/<dbname>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Set in Render Dashboard: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Set in Render Dashboard: your_password
      - key: GIGMATE_JWT_SECRET
        generateValue: true
      - key: GIGMATE_JWT_EXPIRATION
        value: 86400000

  # ==========================================================
  # ⚛️ 2. GigMate React Vite Frontend (Fast, 100% Free Static Site)
  # ==========================================================
  - type: web
    name: gigmate-frontend
    runtime: static
    rootDir: gigmate-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gigmate-backend.onrender.com/api
