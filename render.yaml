services:
  # ☕ 1. Backend Web Service Instance
  - type: web
    name: gigmate-backend-prod
    runtime: docker
    repo: https://github.com
    plan: free
    region: singapore
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://://aivencloud.com
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        value: your_actual_aiven_password_here # ⚠️ Replace this with your exact Aiven database password!
      - key: GIGMATE_JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: GIGMATE_JWT_EXPIRATION
        value: 86400000

  # ⚛️ 2. Frontend React Web Service Instance
  - type: web
    name: gigmate-frontend-prod
    runtime: docker
    repo: https://github.com
    plan: free
    region: singapore
    rootDir: gigmate-frontend
    envVars:
      - key: PORT
        value: 80
