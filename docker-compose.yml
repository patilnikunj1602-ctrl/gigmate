services:
  # 🐬 1. MySQL Database Server Container Instance
  mysqldb:
    image: mysql:8.0
    container_name: gigmate-mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gigmate_db
    ports:
      - "3307:3306"
    networks:
      - gigmate-network
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  # ☕ 2. Spring Boot REST API Backend Container (Custom folder: backend)
  backend:
    build: ./backend
    container_name: gigmate-backend-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/gigmate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      GIGMATE_JWT_SECRET: 9a4f2c8d3e1b7f6a0c5b4e3d2f1a6c7b8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b
      GIGMATE_JWT_EXPIRATION: 86400000
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - gigmate-network

  # ⚛️ 3. React.js Frontend Production Container (Custom folder: gigmate-frontend)
  frontend:
    build: ./gigmate-frontend
    container_name: gigmate-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gigmate-network

networks:
  gigmate-network:
    driver: bridge

volumes:
  mysql-data:
